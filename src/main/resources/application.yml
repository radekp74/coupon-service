spring:
  application:
    name: coupon-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/coupon_service}
    username: ${DATABASE_USERNAME:coupon_service}
    password: ${DATABASE_PASSWORD:coupon_service}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: ${spring.application.name}
    description: Empik backend recruitment coupon service

coupon:
  client-ip:
    mode: direct
    trusted-proxies: []
    max-forwarded-hops: 20
    max-header-length: 4096
  geolocation:
    provider: ipwhois
    base-uri: https://ipwho.is
    connect-timeout: 500ms
    response-timeout: 1s
    maximum-response-body-bytes: 16384
    stub-country: PL

springdoc:
  swagger-ui:
    path: /swagger-ui
    url: /openapi.yaml
    disable-swagger-default-url: true
    try-it-out-enabled: true
    display-operation-id: true
    operations-sorter: method
