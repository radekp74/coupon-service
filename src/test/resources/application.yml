spring:
  main:
    banner-mode: "off"
  flyway:
    clean-disabled: true

logging:
  level:
    root: WARN
    org.flywaydb.core: INFO

springdoc:
  swagger-ui:
    path: /swagger-ui
    url: /openapi.yaml
    disable-swagger-default-url: true
    try-it-out-enabled: true
    display-operation-id: true
    operations-sorter: method

coupon:
  client-ip:
    mode: direct
    trusted-proxies: []
    max-forwarded-hops: 20
    max-header-length: 4096
  geolocation:
    provider: ipwhois
    base-uri: https://ipwho.is
    connect-timeout: 500ms
    response-timeout: 1s
    maximum-response-body-bytes: 16384
    stub-country: PL
