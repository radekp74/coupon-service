name: coupon-service

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: coupon_service
      POSTGRES_USER: coupon_service
      POSTGRES_PASSWORD: coupon_service
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coupon_service -d coupon_service"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - coupon-postgres-data:/var/lib/postgresql
    restart: unless-stopped

  app:
    image: coupon-service:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/coupon_service
      DATABASE_USERNAME: coupon_service
      DATABASE_PASSWORD: coupon_service
      DATABASE_POOL_MAX_SIZE: 10
      DATABASE_POOL_MIN_IDLE: 1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  coupon-postgres-data:
